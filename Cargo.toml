[package]
name = "ai-translator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
reqwest = { version = "0.13.1", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
walkdir = "2.5"
regex = "1.12"
chrono = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
rand = "0.9"
once_cell = "1.21"
async-trait = "0.1"
pathdiff = "0.2"
tempfile = "3.24"
url = "2.5"
yaml-rust = "0.4"

[dev-dependencies]
tempfile = "3.0"
wiremock = "0.6.5"
serde_json = "1.0"
futures = "0.3"

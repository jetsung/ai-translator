[package]
name = "ai-translator"
version = "0.1.2"
edition = "2024"

description = "基于 AI 的多语言文本翻译工具，支持自定义提示词"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/jetsung/ai-translator"
homepage = "https://github.com/jetsung/ai-translator"
keywords = ["translator", "translation", "ai", "language", "nlp"]
categories = ["text-processing", "internationalization"]

[[bin]]
name = "aitr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "native-tls-vendored", "gzip", "brotli", "deflate", "http2", "charset"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
walkdir = "2.5"
regex = "1.12"
chrono = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
rand = "0.9"
once_cell = "1.21"
async-trait = "0.1"
pathdiff = "0.2"
tempfile = "3.24"
url = "2.5"

[dev-dependencies]
tempfile = "3.24"
wiremock = "0.6.5"
serde_json = "1.0"
futures = "0.3"
